databases:
  - name: mfw-postgres
    plan: free
    region: frankfurt
    databaseName: mfw_postgres
    user: mfw_postgres_user
    postgresMajorVersion: "17"

services:
  - type: web
    name: mfw-platform
    runtime: static
    repo: https://github.com/PetrFedin/MFW
    branch: main
    autoDeployTrigger: commit
    buildCommand: echo "MFW static build"
    staticPublishPath: ./mfw

  - type: web
    name: mfw-api
    runtime: node
    repo: https://github.com/PetrFedin/MFW
    branch: main
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: echo "MFW API build"
    startCommand: node mfw-api/server.js

  - type: web
    name: mfw-authority
    runtime: node
    repo: https://github.com/PetrFedin/MFW
    branch: main
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: cd mfw-api && npm install --omit=dev
    preDeployCommand: cd mfw-api && npm run migrate
    startCommand: cd mfw-api && node server-v2.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MFW_REQUIRE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mfw-postgres
          property: connectionString
      - key: MFW_JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VK_CLIENT_ID
        sync: false
      - key: VK_CLIENT_SECRET
        sync: false

  - type: cron
    name: mfw-social-reverification
    runtime: node
    repo: https://github.com/PetrFedin/MFW
    branch: main
    plan: free
    region: frankfurt
    schedule: "17 3 * * *"
    buildCommand: cd mfw-api && npm install --omit=dev
    startCommand: cd mfw-api && node reverify-social.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mfw-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VK_CLIENT_ID
        sync: false
      - key: VK_CLIENT_SECRET
        sync: false
