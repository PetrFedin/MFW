databases:
  - name: mfw-postgres
    plan: free
    region: frankfurt
    databaseName: mfw_postgres
    user: mfw_postgres_user
    postgresMajorVersion: "17"

services:
  - type: web
    name: mfw-platform
    runtime: static
    repo: https://github.com/PetrFedin/MFW
    branch: main
    autoDeployTrigger: commit
    buildCommand: echo "MFW static build"
    staticPublishPath: ./mfw

  - type: web
    name: mfw-api
    runtime: node
    repo: https://github.com/PetrFedin/MFW
    branch: main
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: echo "MFW API build"
    startCommand: node mfw-api/server.js

  - type: web
    name: mfw-authority
    runtime: node
    repo: https://github.com/PetrFedin/MFW
    branch: main
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: cd mfw-api && npm install --omit=dev
    startCommand: cd mfw-api && node server-v2.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: MFW_REQUIRE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: mfw-postgres
          property: connectionString
      - key: MFW_ALLOWED_ORIGIN
        value: https://mfw-platform.onrender.com
      - key: MFW_PUBLIC_BASE_URL
        value: https://mfw-authority.onrender.com
      - key: MFW_REVERIFY_INTERVAL_MINUTES
        value: "360"
      - key: MFW_REVERIFY_BATCH_SIZE
        value: "250"
      - key: MFW_ADMIN_TOKEN
        generateValue: true
      - key: MFW_ES256_SEED
        generateValue: true
      - key: MFW_TELEGRAM_BOT_TOKEN
        sync: false
      - key: MFW_TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: MFW_TELEGRAM_LOGIN_CLIENT_ID
        sync: false
      - key: MFW_TELEGRAM_LOGIN_CLIENT_SECRET
        sync: false
      - key: MFW_VK_SERVICE_TOKEN
        sync: false
      - key: MFW_VK_APP_ID
        sync: false
