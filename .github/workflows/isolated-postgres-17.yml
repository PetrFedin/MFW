name: Isolated PostgreSQL 17 Replay
on:
  pull_request:
    branches: [main]
    paths:
      - "mfw-api/migrations/**"
      - "mfw-api/migration-*.js"
      - "mfw-api/migrate.js"
      - "mfw-api/recovery-candidates/**"
      - "mfw-api/recovery-candidate-contract.test.js"
      - ".github/workflows/isolated-postgres-17.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mfw-scratch-pg17
  cancel-in-progress: true
jobs:
  postgres-isolated:
    name: Scratch PG17 / replay and restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mfw_ci
          POSTGRES_PASSWORD: mfw_ci_local_only
          POSTGRES_DB: mfw_scratch_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mfw_ci -d mfw_scratch_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      CI: "true"
      MFW_ISOLATED_PG_CI: "true"
      DATABASE_URL: postgresql://mfw_ci:mfw_ci_local_only@127.0.0.1:5432/mfw_scratch_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: mfw-api
        run: npm install --no-audit --no-fund
      - name: Validate quarantined candidates
        run: node mfw-api/recovery-candidate-contract.test.js
      - name: Verify two independent migration histories without admission
        run: node mfw-api/recovery-candidates/dual-migration-ledger.test.js
      - name: Replay scratch 001-025 then scratch 001-027 candidates
        run: node mfw-api/recovery-candidates/isolated-replay.test.js
      - name: Replay origin-commit-pinned 026-027 SQL and compare real catalog shape
        run: node mfw-api/recovery-candidates/original-git-replay.test.js
      - name: Backup and restore origin-commit SQL in disposable PG17
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" pg_dump -U mfw_ci -d mfw_original_ci -Fc -f /tmp/mfw_original_ci.dump
          docker exec "$PG_CONTAINER" psql -U mfw_ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mfw_original_restored_ci'
          docker exec "$PG_CONTAINER" pg_restore -U mfw_ci -d mfw_original_restored_ci --no-owner --exit-on-error /tmp/mfw_original_ci.dump
          test "$(docker exec "$PG_CONTAINER" psql -U mfw_ci -d mfw_original_restored_ci -tAc 'SELECT COUNT(*) FROM public.schema_migrations')" = "27"
          test "$(docker exec "$PG_CONTAINER" psql -U mfw_ci -d mfw_original_restored_ci -tAc "SELECT COUNT(*) FROM public.authority_outbox WHERE event_key='ci:git-origin'")" = "1"
          test "$(docker exec "$PG_CONTAINER" psql -U mfw_ci -d mfw_original_restored_ci -tAc "SELECT COUNT(*) FROM public.authority_delivery_receipts WHERE consumer='consumer_A' AND event_key='ci:git-origin'")" = "1"
          echo "origin_git_sql_backup_restore=PASS; applied_sql_provenance=UNVERIFIED; production_admission=BLOCKED"
      - name: Verify scratch-only anonymous and authenticated-style SQL access denial
        run: node mfw-api/recovery-candidates/scratch-role-boundary.test.js
      - name: Qualify default-ACL hardening with disposable future-object canaries
        run: node mfw-api/recovery-candidates/default-privileges-scratch.test.js
      - name: Backup, restore and verify synthetic candidate records
        shell: bash
        run: |
          set -euo pipefail
          PG_CONTAINER="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$PG_CONTAINER"
          docker exec "$PG_CONTAINER" pg_dump -U mfw_ci -d mfw_candidate_ci -Fc -f /tmp/mfw_candidate_ci.dump
          docker exec "$PG_CONTAINER" psql -U mfw_ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mfw_restored_ci'
          docker exec "$PG_CONTAINER" pg_restore -U mfw_ci -d mfw_restored_ci --no-owner --exit-on-error /tmp/mfw_candidate_ci.dump
          MIGRATIONS="$(docker exec "$PG_CONTAINER" psql -U mfw_ci -d mfw_restored_ci -tAc 'SELECT COUNT(*) FROM public.schema_migrations')"
          test "$MIGRATIONS" = "27"
          RECEIPTS="$(docker exec "$PG_CONTAINER" psql -U mfw_ci -d mfw_restored_ci -tAc "SELECT COUNT(*) FROM public.authority_delivery_receipts WHERE consumer='consumer_A' AND event_key='ci:restore-test'")"
          test "$RECEIPTS" = "1"
          echo "scratch_pg17_backup_restore=PASS; production_admission=BLOCKED"
      - name: Validate forward-only multi-consumer receipt integrity on restored scratch clone
        run: node mfw-api/recovery-candidates/consumer-scoped-receipts-scratch.test.js
      - name: Qualify audited manual redrive of dead-letter in restored scratch PG17
        run: node mfw-api/recovery-candidates/manual-redrive-scratch.test.js
      - name: Run real transactional scratch worker with per-delivery consent and tenant gate
        run: node mfw-api/recovery-candidates/outbox-worker-scratch.test.js
