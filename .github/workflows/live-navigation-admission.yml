name: Live Navigation Admission
on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'
permissions:
  contents: read
concurrency:
  group: mfw-live-navigation
  cancel-in-progress: true
jobs:
  live-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install QA dependencies
        working-directory: qa
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: qa
        run: npx playwright install --with-deps chromium
      - name: Check production navigation
        working-directory: qa
        run: npx playwright test --config=live-navigation.config.js
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-navigation-evidence
          path: |
            qa/test-results
            qa/playwright-report
          if-no-files-found: ignore
          retention-days: 14
