name: Phase 0 Readiness Contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfw-phase0-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install authority dependencies
        working-directory: mfw-api
        run: npm install --no-audit --no-fund
      - name: Run Phase 0 fail-closed contract
        working-directory: mfw-api
        run: npm run check:foundation
