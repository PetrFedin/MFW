name: Isolated PostgreSQL 17 qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'mfw-api/migrations/**'
      - 'mfw-api/recovery-candidates/**'
      - 'mfw-api/isolated-postgres-replay.test.js'
      - 'mfw-api/migration-runner.js'
      - '.github/workflows/isolated-postgres-17-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg17-scratch-only:
    name: 001-027 candidate replay and independent PG17 restore
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      # Ephemeral test-only password, not a service or production credential.
      CI_ONLY_POSTGRES_PASSWORD: mfw_disposable_ci_2026_only
      MFW_ISOLATED_PG_TEST: DISPOSABLE_GITHUB_ACTIONS_PG17
      PG_ISOLATED_ADMISSION_URL: postgresql://postgres:mfw_disposable_ci_2026_only@127.0.0.1:5432/mfw_admission_ci
    services:
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mfw_disposable_ci_2026_only
          POSTGRES_DB: mfw_admission_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mfw_admission_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard against connecting to any real database
        run: |
          test -z "$DATABASE_URL"
          test -z "$SUPABASE_DB_URL"
          test "$MFW_ISOLATED_PG_TEST" = "DISPOSABLE_GITHUB_ACTIONS_PG17"
      - name: Install only local authority dependencies
        working-directory: mfw-api
        run: npm install --no-audit --no-fund
      - name: Replay catalog candidates in disposable PG17 and prove negative SQL
        working-directory: mfw-api
        run: node isolated-postgres-replay.test.js
      - name: Dump, restore, verify second disposable database using PostgreSQL 17 client
        run: |
          set -eu
          docker run --rm --network host -e "PGPASSWORD=$CI_ONLY_POSTGRES_PASSWORD" postgres:17 \
            pg_dump -h 127.0.0.1 -U postgres -d mfw_admission_ci --format=custom --no-owner --no-acl > /tmp/mfw_isolated_pg17.dump
          test -s /tmp/mfw_isolated_pg17.dump
          docker run --rm --network host -e "PGPASSWORD=$CI_ONLY_POSTGRES_PASSWORD" postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE mfw_admission_restore;'
          docker run --rm -i --network host -e "PGPASSWORD=$CI_ONLY_POSTGRES_PASSWORD" postgres:17 \
            pg_restore --exit-on-error --no-owner --no-acl \
              -h 127.0.0.1 -U postgres -d mfw_admission_restore < /tmp/mfw_isolated_pg17.dump
          PG_ISOLATED_ADMISSION_URL="postgresql://postgres:$CI_ONLY_POSTGRES_PASSWORD@127.0.0.1:5432/mfw_admission_restore" \
            node mfw-api/isolated-postgres-replay.test.js --verify-restore
      - name: Evidence boundary
        if: always()
        run: |
          echo 'Disposable PG17 only; NOT original 027 provenance or live DB admission.'
          echo 'Production AUTHORITY, JWT/tenant security and durable worker recovery remain HOLD.'
